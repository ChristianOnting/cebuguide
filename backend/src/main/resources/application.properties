spring.application.name=backend

# ---- Database (MySQL). Credentials are read from environment variables ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cebuguide}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Login tokens (JWT). Set JWT_SECRET to your own value of 32+ characters ----
app.jwt.secret=${JWT_SECRET:cebuguide-dev-secret-change-me-before-deployment-0123456789}
app.jwt.expiration-minutes=60

# ---- CORS (the React dev server also uses a proxy, so this is a second safety net) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Seeded administrator account (FR-025). Change the password with ADMIN_PASSWORD ----
app.admin.name=${ADMIN_NAME:CebuGuide Administrator}
app.admin.email=${ADMIN_EMAIL:admin@cebuguide.local}
app.admin.password=${ADMIN_PASSWORD:Admin12345}

# ---- Password reset (Increment 2) ----
app.reset-token-minutes=30
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:}

# ---- Email through Gmail SMTP. MAIL_USERNAME is your Gmail address and MAIL_PASSWORD is a Google App Password ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
